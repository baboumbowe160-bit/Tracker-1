# Builds the self-contained Android app (all app files inside the APK, no website needed).
# Runs by itself every time you upload files to this repository, or by hand from the Actions tab.
# Needs two repository secrets: ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD.
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the app files
        uses: actions/checkout@v5
        with:
          path: web

      - name: Check the signing key is set up
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::The signing key is missing. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Write the Android project
        run: |
          set -e
          A=android/app/src/main
          mkdir -p $A/java/com/baboumbowe/agentclienttracker/app $A/res/values $A/res/xml \
                   $A/res/mipmap-xxxhdpi $A/res/mipmap-anydpi-v26 $A/res/drawable-nodpi $A/assets/www

          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'AgentClientTracker'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.11.1' apply false }
          EOF

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.baboumbowe.agentclienttracker.app'
            compileSdk 36
            defaultConfig {
              applicationId 'com.baboumbowe.agentclienttracker.app'
              minSdk 24
              targetSdk 36
              versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
              versionName System.getenv('VERSION_NAME') ?: '1.0'
            }
            signingConfigs {
              release {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias 'tracker'
                keyPassword System.getenv('KS_PASS')
              }
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.release
              }
            }
            lint {
              checkReleaseBuilds false
              abortOnError false
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.webkit:webkit:1.11.0'
            implementation 'androidx.biometric:biometric:1.1.0'
          }
          EOF

          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.USE_BIOMETRIC" />
            <application
              android:label="@string/app_name"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:theme="@style/AppTheme"
              android:allowBackup="true"
              android:supportsRtl="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask"
                android:screenOrientation="portrait"
                android:windowSoftInputMode="adjustResize"
                android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="text/plain" />
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <!-- No notification reader: Google Play Protect blocks downloaded apps that ask for it.
                   The CaptureService class is kept for a future Play Store version, but it is not switched on. -->
              <provider
                android:name="androidx.core.content.FileProvider"
                android:authorities="${applicationId}.files"
                android:exported="false"
                android:grantUriPermissions="true">
                <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
              </provider>
            </application>
          </manifest>
          EOF

          cat > $A/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Agent &amp; Client Tracker</string></resources>
          EOF

          cat > $A/res/values/colors.xml <<'EOF'
          <resources>
            <color name="paper">#F5F6F8</color>
            <color name="white">#FFFFFF</color>
            <color name="icon_bg">#2453D6</color>
          </resources>
          EOF

          cat > $A/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="android:windowBackground">@color/paper</item>
              <item name="android:statusBarColor">@color/white</item>
              <item name="android:windowLightStatusBar">true</item>
            </style>
          </resources>
          EOF

          cat > $A/res/xml/file_paths.xml <<'EOF'
          <paths><cache-path name="shared" path="shared/" /></paths>
          EOF

          cat > $A/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icon_bg" />
            <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > $A/java/com/baboumbowe/agentclienttracker/app/MainActivity.java <<'EOF'
          package com.baboumbowe.agentclienttracker.app;

          import android.annotation.SuppressLint;
          import android.Manifest;
          import android.content.ActivityNotFoundException;
          import android.content.ComponentName;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.provider.Settings;
          import android.content.ClipData;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.activity.OnBackPressedCallback;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import androidx.webkit.WebViewAssetLoader;

          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          /* The whole app lives inside this APK (assets/www). It is shown in a WebView and never loads a website. */
          public class MainActivity extends AppCompatActivity {
            private static final String HOST = "appassets.androidplatform.net";
            private static final String START = "https://" + HOST + "/assets/www/index.html";
            private static final int REQ_FILE = 11, REQ_SAVE = 12;
            private static final int BIO = BiometricManager.Authenticators.BIOMETRIC_WEAK;

            private WebView web;
            private ValueCallback<Uri[]> fileCallback;
            private byte[] pendingSave;
            private String sharedText;
            private boolean resumed;
            private static MainActivity active;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle state) {
              super.onCreate(state);
              web = new WebView(this);
              /* Draw edge to edge (required on new Android) and keep the app clear of the
                 status bar, the navigation bar and the keyboard. */
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              final FrameLayout root = new FrameLayout(this);
              root.setBackgroundColor(Color.WHITE);
              root.addView(web, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
              setContentView(root);
              WindowInsetsControllerCompat bars = WindowCompat.getInsetsController(getWindow(), root);
              bars.setAppearanceLightStatusBars(true);
              bars.setAppearanceLightNavigationBars(true);
              ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                Insets b = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout() | WindowInsetsCompat.Type.ime());
                v.setPadding(b.left, b.top, b.right, b.bottom);
                return WindowInsetsCompat.CONSUMED;
              });

              final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                  .setDomain(HOST)
                  .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                  .build();

              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              s.setTextZoom(100);

              web.addJavascriptInterface(new Bridge(), "AndroidBridge");

              web.setWebViewClient(new WebViewClient() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  return loader.shouldInterceptRequest(request.getUrl());
                }
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                  Uri u = request.getUrl();
                  if (HOST.equals(u.getHost())) return false;
                  openExternal(u);
                  return true;
                }
              });

              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                  if (fileCallback != null) fileCallback.onReceiveValue(null);
                  fileCallback = callback;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  try {
                    startActivityForResult(Intent.createChooser(i, null), REQ_FILE);
                  } catch (ActivityNotFoundException e) {
                    fileCallback = null;
                    return false;
                  }
                  return true;
                }
              });

              getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                @Override
                public void handleOnBackPressed() {
                  if (web.canGoBack()) {
                    web.goBack();
                  } else {
                    setEnabled(false);
                    getOnBackPressedDispatcher().onBackPressed();
                    setEnabled(true);
                  }
                }
              });

              active = this;
              readShare(getIntent());
              web.loadUrl(START);
            }

            @Override
            protected void onStart() {
              super.onStart();
              js("window.__appShown && window.__appShown()");
            }

            @Override
            protected void onStop() {
              js("window.__appHidden && window.__appHidden()");
              super.onStop();
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              if (readShare(intent)) js("window.__sharedArrived && window.__sharedArrived()");
            }

            @Override
            protected void onResume() {
              super.onResume();
              resumed = true;
              active = this;
              js("window.__captureArrived && window.__captureArrived()");
            }

            @Override
            protected void onPause() {
              resumed = false;
              super.onPause();
            }

            /* Text shared to the app from an SMS, a wallet app or anywhere else. */
            private boolean readShare(Intent intent) {
              if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) return false;
              CharSequence t = intent.getCharSequenceExtra(Intent.EXTRA_TEXT);
              String sub = intent.getStringExtra(Intent.EXTRA_SUBJECT);
              if (t == null && sub == null) return false;
              sharedText = ((sub != null ? sub + " " : "") + (t != null ? t : "")).trim();
              return true;
            }

            /* Called by CaptureService when a payment message arrives. Returns false if the app is not on screen. */
            static boolean deliverIfOpen() {
              final MainActivity a = active;
              if (a == null || !a.resumed) return false;
              a.runOnUiThread(() -> a.js("window.__captureArrived && window.__captureArrived()"));
              return true;
            }

            private SharedPreferences capturePrefs() {
              return getSharedPreferences(CaptureService.PREFS, MODE_PRIVATE);
            }

            @Override
            protected void onDestroy() {
              if (active == this) active = null;
              if (web != null) web.destroy();
              super.onDestroy();
            }

            @Override
            protected void onActivityResult(int request, int result, Intent data) {
              super.onActivityResult(request, result, data);
              if (request == REQ_FILE) {
                if (fileCallback != null) {
                  Uri[] picked = null;
                  if (result == RESULT_OK && data != null && data.getData() != null) picked = new Uri[] { data.getData() };
                  fileCallback.onReceiveValue(picked);
                  fileCallback = null;
                }
              } else if (request == REQ_SAVE) {
                boolean ok = false;
                if (result == RESULT_OK && data != null && data.getData() != null && pendingSave != null) {
                  try (OutputStream out = getContentResolver().openOutputStream(data.getData())) {
                    out.write(pendingSave);
                    ok = true;
                  } catch (Exception e) {
                    ok = false;
                  }
                }
                pendingSave = null;
                if (result == RESULT_OK) toast(ok ? "Saved" : "Could not save the file");
              }
            }

            private void js(String code) {
              if (web != null) web.evaluateJavascript(code, null);
            }

            private void toast(String msg) {
              Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
            }

            private void openExternal(Uri u) {
              try {
                Intent i = new Intent(Intent.ACTION_VIEW, u);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
              } catch (ActivityNotFoundException e) {
                toast("No app on this phone can open this link");
              }
            }

            private void showBio(final String id, String title, String cancel) {
              BiometricPrompt prompt = new BiometricPrompt(this, ContextCompat.getMainExecutor(this),
                  new BiometricPrompt.AuthenticationCallback() {
                    @Override
                    public void onAuthenticationSucceeded(@NonNull BiometricPrompt.AuthenticationResult r) {
                      bioDone(id, true, "");
                    }
                    @Override
                    public void onAuthenticationError(int code, @NonNull CharSequence msg) {
                      bioDone(id, false, String.valueOf(msg));
                    }
                  });
              BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                  .setTitle(title == null || title.isEmpty() ? "Unlock" : title)
                  .setNegativeButtonText(cancel == null || cancel.isEmpty() ? "Use PIN" : cancel)
                  .setAllowedAuthenticators(BIO)
                  .build();
              try {
                prompt.authenticate(info);
              } catch (Exception e) {
                bioDone(id, false, "Fingerprint is not available");
              }
            }

            private void bioDone(String id, boolean ok, String msg) {
              js("window.__bioDone && window.__bioDone(" + JSONObject.quote(id) + "," + ok + "," + JSONObject.quote(msg) + ")");
            }

            /* Called from the app's JavaScript as window.AndroidBridge.* */
            private class Bridge {
              @JavascriptInterface
              public boolean bioAvailable() {
                return BiometricManager.from(MainActivity.this).canAuthenticate(BIO) == BiometricManager.BIOMETRIC_SUCCESS;
              }

              @JavascriptInterface
              public void bioAuth(final String id, final String title, final String cancel) {
                runOnUiThread(() -> showBio(id, title, cancel));
              }

              @JavascriptInterface
              public void saveFile(final String name, final String mime, final String base64) {
                runOnUiThread(() -> {
                  try {
                    pendingSave = Base64.decode(base64, Base64.DEFAULT);
                  } catch (Exception e) {
                    pendingSave = null;
                    toast("Could not save the file");
                    return;
                  }
                  Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType(mime == null || mime.isEmpty() ? "application/octet-stream" : mime);
                  i.putExtra(Intent.EXTRA_TITLE, name);
                  try {
                    startActivityForResult(i, REQ_SAVE);
                  } catch (ActivityNotFoundException e) {
                    pendingSave = null;
                    toast("Could not save the file");
                  }
                });
              }

              @JavascriptInterface
              public void shareFile(final String name, final String mime, final String base64) {
                runOnUiThread(() -> {
                  try {
                    File dir = new File(getCacheDir(), "shared");
                    if (!dir.exists()) dir.mkdirs();
                    File f = new File(dir, name.replaceAll("[^A-Za-z0-9._-]", "_"));
                    try (FileOutputStream out = new FileOutputStream(f)) {
                      out.write(Base64.decode(base64, Base64.DEFAULT));
                    }
                    Uri u = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".files", f);
                    Intent i = new Intent(Intent.ACTION_SEND);
                    i.setType(mime == null || mime.isEmpty() ? "application/octet-stream" : mime);
                    i.putExtra(Intent.EXTRA_STREAM, u);
                    i.setClipData(ClipData.newRawUri("", u));
                    i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                    startActivity(Intent.createChooser(i, name));
                  } catch (Exception e) {
                    toast("Could not share the file");
                  }
                });
              }

              @JavascriptInterface
              public void shareText(final String text) {
                runOnUiThread(() -> {
                  Intent i = new Intent(Intent.ACTION_SEND);
                  i.setType("text/plain");
                  i.putExtra(Intent.EXTRA_TEXT, text);
                  try {
                    startActivity(Intent.createChooser(i, null));
                  } catch (Exception e) {
                    toast("No app on this phone can share this");
                  }
                });
              }

              @JavascriptInterface
              public String getSharedText() {
                String t = sharedText;
                sharedText = null;
                return t == null ? "" : t;
              }

              @JavascriptInterface
              public String takeCaptured() {
                SharedPreferences p = capturePrefs();
                String q = p.getString("queue", "[]");
                p.edit().putString("queue", "[]").apply();
                return q;
              }

              @JavascriptInterface
              public String captureStatusDisabled() {
                boolean on = NotificationManagerCompat.getEnabledListenerPackages(MainActivity.this).contains(getPackageName());
                boolean alerts = capturePrefs().getBoolean("alerts", false) && NotificationManagerCompat.from(MainActivity.this).areNotificationsEnabled();
                return "{\"listener\":" + on + ",\"alerts\":" + alerts + "}";
              }

              @JavascriptInterface
              public void openCaptureSettings() {
                runOnUiThread(() -> {
                  Intent i;
                  if (Build.VERSION.SDK_INT >= 30) {
                    i = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_DETAIL_SETTINGS);
                    i.putExtra(Settings.EXTRA_NOTIFICATION_LISTENER_COMPONENT_NAME, new ComponentName(MainActivity.this, CaptureService.class).flattenToString());
                  } else {
                    i = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);
                  }
                  try {
                    startActivity(i);
                  } catch (Exception e) {
                    try {
                      startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS));
                    } catch (Exception e2) {
                      toast("Open Settings, then Notifications, then Notification access");
                    }
                  }
                });
              }

              @JavascriptInterface
              public void openAppInfo() {
                runOnUiThread(() -> {
                  try {
                    startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName())));
                  } catch (Exception e) {
                    toast("Open Settings, then Apps, then Agent & Client Tracker");
                  }
                });
              }

              @JavascriptInterface
              public void setAlerts(final boolean on) {
                runOnUiThread(() -> {
                  capturePrefs().edit().putBoolean("alerts", on).apply();
                  if (on && Build.VERSION.SDK_INT >= 33
                      && ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(MainActivity.this, new String[] { Manifest.permission.POST_NOTIFICATIONS }, 21);
                  }
                });
              }

              @JavascriptInterface
              public void openUrl(final String url) {
                runOnUiThread(() -> openExternal(Uri.parse(url)));
              }
            }
          }
          EOF

          cat > $A/java/com/baboumbowe/agentclienttracker/app/CaptureService.java <<'EOF'
          package com.baboumbowe.agentclienttracker.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.Set;
          import java.util.regex.Pattern;

          /* Reads notifications that look like payments (from wallet, bank and SMS apps) and keeps them on the phone,
             ready to be recorded in the app. Chat apps are never read. Nothing is sent anywhere. */
          public class CaptureService extends NotificationListenerService {
            static final String PREFS = "capture";
            private static final String CHANNEL = "payments";
            private static final Set<String> SKIP = new HashSet<>(Arrays.asList(
                "com.whatsapp", "com.whatsapp.w4b", "org.telegram.messenger", "org.thunderdog.challegram", "com.facebook.orca", "com.facebook.katana",
                "com.facebook.lite", "com.facebook.mlite", "com.instagram.android", "com.snapchat.android", "com.imo.android.imoim", "com.viber.voip",
                "com.google.android.gm", "com.google.android.youtube", "com.zhiliaoapp.musically", "com.twitter.android", "com.discord", "org.thoughtcrime.securesms"));
            private static final Pattern MONEY = Pattern.compile("(?i)(?:\\bGMD|\\bD|dalasi)\\s?\\d|\\d\\s?(?:GMD|D\\b|dalasi)");
            private static final Pattern WORDS = Pattern.compile("(?i)receiv|sent|credit|debit|transfer|deposit|withdraw|paid|payment|cash ?in|cash ?out|balance|re[cç]u|envoy|solde|wave|afri|qmoney|\\baps\\b|nafa|yonna|bank");

            @Override
            public void onNotificationPosted(StatusBarNotification sbn) {
              try {
                String pkg = sbn.getPackageName();
                if (pkg == null || pkg.equals(getPackageName()) || SKIP.contains(pkg)) return;
                Notification n = sbn.getNotification();
                if (n == null || (n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;
                Bundle x = n.extras;
                if (x == null) return;
                CharSequence title = x.getCharSequence(Notification.EXTRA_TITLE);
                CharSequence big = x.getCharSequence(Notification.EXTRA_BIG_TEXT);
                CharSequence text = big != null ? big : x.getCharSequence(Notification.EXTRA_TEXT);
                StringBuilder sb = new StringBuilder();
                if (title != null) sb.append(title).append(". ");
                if (text != null) sb.append(text);
                CharSequence[] lines = x.getCharSequenceArray(Notification.EXTRA_TEXT_LINES);
                if (text == null && lines != null) for (CharSequence l : lines) sb.append(l).append(' ');
                String all = sb.toString().replaceAll("\\s+", " ").trim();
                if (all.length() < 8 || !MONEY.matcher(all).find() || !WORDS.matcher(all).find()) return;

                String id = Integer.toHexString((pkg + "|" + all).hashCode());
                SharedPreferences p = getSharedPreferences(PREFS, MODE_PRIVATE);
                String seen = p.getString("seen", "");
                if (seen.contains(id + ",")) return;
                seen = id + "," + seen;
                if (seen.length() > 4000) seen = seen.substring(0, 4000);

                JSONArray q = new JSONArray(p.getString("queue", "[]"));
                JSONObject o = new JSONObject();
                o.put("id", id);
                o.put("text", all);
                o.put("app", appName(pkg));
                o.put("when", sbn.getPostTime());
                q.put(o);
                while (q.length() > 100) q.remove(0);
                p.edit().putString("queue", q.toString()).putString("seen", seen).apply();

                if (!MainActivity.deliverIfOpen() && p.getBoolean("alerts", false)) alert(all);
              } catch (Exception ignored) {
              }
            }

            private String appName(String pkg) {
              String k = pkg.toLowerCase();
              if (k.contains("wave")) return "Wave";
              if (k.contains("afri")) return "Afrimoney";
              if (k.contains("qmoney") || k.contains("qcell")) return "QMoney";
              try {
                PackageManager pm = getPackageManager();
                return String.valueOf(pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)));
              } catch (Exception e) {
                return "";
              }
            }

            private void alert(String text) {
              NotificationManagerCompat nm = NotificationManagerCompat.from(this);
              if (!nm.areNotificationsEnabled()) return;
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationManager sys = getSystemService(NotificationManager.class);
                if (sys != null && sys.getNotificationChannel(CHANNEL) == null) {
                  sys.createNotificationChannel(new NotificationChannel(CHANNEL, "Payments to record", NotificationManager.IMPORTANCE_DEFAULT));
                }
              }
              Intent open = new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
              PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              NotificationCompat.Builder b = new NotificationCompat.Builder(this, CHANNEL)
                  .setSmallIcon(R.drawable.ic_stat)
                  .setContentTitle("Payment ready to record")
                  .setContentText(text)
                  .setStyle(new NotificationCompat.BigTextStyle().bigText(text))
                  .setContentIntent(pi)
                  .setAutoCancel(true);
              try {
                nm.notify(7001, b.build());
              } catch (SecurityException ignored) {
              }
            }
          }
          EOF

          mkdir -p $A/res/drawable
          cat > $A/res/drawable/ic_stat.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M4,4h16a2,2 0 0,1 2,2v10a2,2 0 0,1 -2,2H9l-5,4v-4H4a2,2 0 0,1 -2,-2V6a2,2 0 0,1 2,-2z"/>
          </vector>
          EOF


      - name: Copy the app files and icon into the project
        run: |
          set -e
          shopt -s nullglob
          A=android/app/src/main
          for f in web/*.html web/*.js web/*.css web/*.png web/*.webmanifest; do cp "$f" $A/assets/www/; done
          rm -f $A/assets/www/sw.js
          if [ -d web/logos ]; then cp -r web/logos $A/assets/www/; fi
          test -f $A/assets/www/index.html || { echo "::error::index.html was not found in the repository"; exit 1; }
          cp web/icon-192.png $A/res/mipmap-xxxhdpi/ic_launcher.png
          cp web/icon-maskable-512.png $A/res/drawable-nodpi/ic_fg.png
          ls -la $A/assets/www

      - name: Build and sign the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          report() {  # show the important lines of a log as an error note on the run page
            msg=$(grep -E "$2" "$1" | grep -v '^\s*at ' | tail -n 40 | cut -c1-220 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | head -c 3800)
            echo "::error title=$3::$msg"
          }
          if ! printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2> "$RUNNER_TEMP/b64.log"; then
            echo "::error title=Signing key::ANDROID_KEYSTORE_BASE64 is not complete or has extra characters. Copy it again in full."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias tracker > "$RUNNER_TEMP/kt.log" 2>&1; then
            report "$RUNNER_TEMP/kt.log" "." "Signing key"
            echo "::error title=Signing key::The key file or ANDROID_KEYSTORE_PASSWORD does not match. Copy both secrets again."
            exit 1
          fi
          export KS_FILE="$RUNNER_TEMP/release.jks"
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="1.${GITHUB_RUN_NUMBER}"
          cd android
          if ! gradle --no-daemon --stacktrace assembleRelease bundleRelease > "$RUNNER_TEMP/gradle.log" 2>&1; then
            cat "$RUNNER_TEMP/gradle.log"
            report "$RUNNER_TEMP/gradle.log" "error|Error|What went wrong|FAILURE|Could not|> |Caused by|failed" "Build failed"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/agent-client-tracker-app.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/agent-client-tracker-app-play-store.aab"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Keep a copy of the APK on this run
        uses: actions/upload-artifact@v4
        with:
          name: agent-client-tracker-app
          path: |
            agent-client-tracker-app.apk
            agent-client-tracker-app-play-store.aab

      - name: Publish the APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Android app ${{ github.run_number }}
          body: |
            Self-contained Android app.
            Phones: download agent-client-tracker-app.apk and open it.
            Google Play: agent-client-tracker-app-play-store.aab is the file to upload in Play Console.
          files: |
            agent-client-tracker-app.apk
            agent-client-tracker-app-play-store.aab
          make_latest: true
